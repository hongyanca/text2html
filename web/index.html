<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text to HTML</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">TEXT2HTML</p>
    <h1>Turn plain text into HTML</h1>
    <p class="intro">Choose a .txt file and we’ll format its paragraphs into a clean HTML document.</p>
    <form id="convert-form">
      <input id="file-input" type="file" accept=".txt,text/plain" hidden>
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Choose or drop a text file">
        <div class="file-icon">TXT</div>
        <strong>Drop your text file here</strong>
        <span>or <button id="browse" type="button" class="text-button">browse files</button></span>
        <small id="file-name">Only .txt files, up to 5 MB</small>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="convert" class="convert" type="submit" disabled>Convert to HTML</button>
    </form>
    <section id="progress-panel" class="progress-panel" aria-live="polite" hidden>
      <div class="progress-heading"><span id="stage">Uploading</span><span id="percent">0%</span></div>
      <div class="track"><div id="bar" class="bar"></div></div>
      <p id="status-message">Preparing upload…</p>
    </section>
    <section id="result" class="result" hidden>
      <div class="result-header"><strong>Your HTML is ready</strong><a id="download-link">Download HTML</a></div>
      <a id="open-link" class="open-result-button" target="_blank" rel="noopener">Open generated HTML</a>
    </section>
    <div class="cleanup-row">
      <button id="delete-generated" type="button" class="delete-button">Delete all generated HTML files</button>
      <span id="cleanup-message" role="status"></span>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
